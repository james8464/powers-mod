plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id 'info.solidsoft.pitest' version '1.19.0'
}

pitest {
	pitestVersion = '1.25.3'
	junit5PluginVersion = '1.2.3'
	targetClasses = [
			'com.powers.magic.MagicInteractionResolver',
			'com.powers.magic.runtime.MagicLifecycleRules',
			'com.powers.item.artifact.ArtifactAuthorizationRules',
			'com.powers.power.abilities.ForcefieldRules',
			'com.powers.power.abilities.TimeFreezeDrainRules',
			'com.powers.spell.CelestialRuinRules'
	]
	targetTests = [
			'com.powers.magic.MagicInteractionResolverTest',
			'com.powers.magic.runtime.MagicLifecycleRulesTest',
			'com.powers.item.artifact.ArtifactAuthorizationRulesTest',
			'com.powers.power.abilities.ForcefieldRulesTest',
			'com.powers.power.abilities.TimeFreezeDrainRulesTest',
			'com.powers.spell.CelestialRuinRulesTest'
	]
	threads = 4
	mutationThreshold = 80
	coverageThreshold = 85
	outputFormats = ['XML', 'HTML']
	timestampedReports = false
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

loom {
	splitEnvironmentSourceSets()
	if (providers.gradleProperty("powersRunDir").isPresent()) {
		runs.named("server") {
			runDirectory.set(file(providers.gradleProperty("powersRunDir").get()))
		}
	}

	mods {
		"powers" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "powers-gametest"
		enableGameTests = true
		enableClientGameTests = true
		eula = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	testImplementation "org.junit.jupiter:junit-jupiter:6.0.3"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher:6.0.3"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}

	exclude "**/.DS_Store"
}

tasks.register("validatePowerResources", Exec) {
	group = "verification"
	description = "Validates JSON, models, textures, translations, recipes and namespace safety."
	commandLine "python3", "scripts/validate_resources.py", "--root", "src/main/resources"
}

tasks.register("auditJavaSources", Exec) {
	group = "verification"
	description = "Verifies the exact-version manifest for every production Java source."
	commandLine "python3", "scripts/audit_java_sources.py", "--check"
}

tasks.register("auditNonItemAssets", Exec) {
	group = "verification"
	description = "Verifies the exact-version manifest for every non-item POWERS asset."
	commandLine "python3", "scripts/audit_non_item_assets.py", "--check"
}

tasks.register("generateMagicDocs", JavaExec) {
	group = "documentation"
	description = "Regenerates the canonical action and exhaustive interaction documents."
	dependsOn("classes")
	classpath = sourceSets.main.runtimeClasspath
	mainClass = "com.powers.magic.MagicDocumentation"
	args projectDir.absolutePath
}

tasks.register("verifyMagicDocs", JavaExec) {
	group = "verification"
	description = "Rejects stale canonical magic interaction documents."
	dependsOn("classes")
	classpath = sourceSets.main.runtimeClasspath
	mainClass = "com.powers.magic.MagicDocumentation"
	args projectDir.absolutePath, "--check"
}

tasks.register("verifyItemDocs", Exec) {
	group = "verification"
	description = "Rejects stale generated item and acquisition documentation."
	commandLine "python3", "scripts/generate_item_docs.py", "--check"
}

tasks.register("generateRankDocs", Exec) {
	group = "documentation"
	description = "Regenerates the source-backed Light and Darkness rank appendix."
	commandLine "python3", "scripts/generate_rank_docs.py"
}

tasks.register("verifyRankDocs", Exec) {
	group = "verification"
	description = "Rejects stale generated Light and Darkness rank documentation."
	commandLine "python3", "scripts/generate_rank_docs.py", "--check"
}

tasks.register("testPythonScripts", Exec) {
	group = "verification"
	description = "Runs deterministic generator and resource-validator fixture tests."
	commandLine "python3", "-B", "-m", "unittest", "discover", "-s", "scripts/tests", "-p", "test_*.py"
}

tasks.named("runGameTest") {
	if (providers.gradleProperty("gameTestFilter").isPresent()) {
		systemProperty "fabric-api.gametest.filter", providers.gradleProperty("gameTestFilter").get()
	}
	doFirst {
		def gameTestRun = layout.buildDirectory.dir("run/gameTest").get().asFile
		gameTestRun.mkdirs()
		def properties = new File(gameTestRun, "server.properties")
		if (!properties.exists()) {
			properties.text = "online-mode=false\nlevel-name=world\n"
		}
		def eula = new File(gameTestRun, "eula.txt")
		if (!eula.exists()) {
			eula.text = "eula=true\n"
		}
	}
}

tasks.named("runServer") {
	// Required by restart_soak.py and useful for ordinary dedicated-server administration.
	standardInput = System.in
	doFirst {
		def configuredRun = providers.gradleProperty("powersRunDir").orNull
		def serverRun = configuredRun == null ? file("run") : file(configuredRun)
		serverRun.mkdirs()
		def properties = new File(serverRun, "server.properties")
		if (!properties.exists()) {
			properties.text = "online-mode=false\nlevel-name=world\n"
		}
		def eula = new File(serverRun, "eula.txt")
		if (!eula.exists()) {
			eula.text = "eula=true\n"
		}
	}
}

tasks.named("check") {
	dependsOn("validatePowerResources")
	dependsOn("auditJavaSources")
	dependsOn("auditNonItemAssets")
	dependsOn("verifyMagicDocs")
	dependsOn("verifyItemDocs")
	dependsOn("verifyRankDocs")
	dependsOn("testPythonScripts")
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.compilerArgs += ["-Xlint:deprecation", "-Xlint:unchecked", "-Werror"]
}

tasks.withType(Test).configureEach { Test testTask ->
	useJUnitPlatform()
	def rawRunId = providers.environmentVariable("POWERS_TEST_RUN_ID")
			.orElse(providers.gradleProperty("powersTestRunId"))
			.orElse("default").get()
	def testRunId = rawRunId.replaceAll("[^A-Za-z0-9._-]", "_").take(80)
	reports.junitXml.outputLocation = layout.buildDirectory.dir("test-results/${testTask.name}/${testRunId}")
	reports.html.outputLocation = layout.buildDirectory.dir("reports/tests/${testTask.name}/${testRunId}")
	binaryResultsDirectory = layout.buildDirectory.dir("test-results/${testTask.name}/${testRunId}/binary")
}

tasks.register("saveMigrationCorpus", Test) {
	description = "Runs versioned save and selection migration acceptance fixtures."
	group = "verification"
	useJUnitPlatform()
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	filter {
		includeTestsMatching "com.powers.migration.*"
		includeTestsMatching "com.powers.item.artifact.ArtifactSelectionMigrationTest"
		includeTestsMatching "com.powers.item.artifact.ArtifactFavouriteRulesTest"
		includeTestsMatching "com.powers.spell.SpellSelectionMigrationTest"
		includeTestsMatching "com.powers.progression.RankMigrationTest"
	}
}

tasks.register("verifyScreenshots", Test) {
	description = "Runs deterministic client presentation and screenshot-contract checks."
	group = "verification"
	useJUnitPlatform()
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	filter {
		includeTestsMatching "com.powers.client.visual.*"
		includeTestsMatching "com.powers.hud.HudLayoutTest"
		includeTestsMatching "com.powers.hud.HudMathTest"
	}
}

tasks.register("syntheticSoak", Test) {
	description = "Runs the separately attributed deterministic multiplayer budget soak."
	group = "verification"
	useJUnitPlatform()
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	filter {
		includeTestsMatching "com.powers.performance.SyntheticMultiplayerSoakTest"
	}
}

tasks.register("updateVisualGoldens", JavaExec) {
	description = "Regenerates reviewed, deterministic client visual goldens."
	group = "documentation"
	dependsOn("testClasses")
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "com.powers.client.visual.VisualGoldenHarness"
	args projectDir.absolutePath, "--update"
}

tasks.register("verifyVisualGoldens", JavaExec) {
	description = "Fails when client visual assets or layout drift from reviewed goldens."
	group = "verification"
	dependsOn("testClasses")
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "com.powers.client.visual.VisualGoldenHarness"
	args projectDir.absolutePath, "--check"
}

tasks.named("verifyScreenshots") {
	dependsOn("verifyVisualGoldens")
}

tasks.register("generateLootDistributionReport", JavaExec) {
	description = "Publishes deterministic additive-loot distribution evidence."
	group = "documentation"
	dependsOn("testClasses")
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "com.powers.loot.LootDistributionReport"
	args projectDir.absolutePath
}

tasks.register("generateManualAcceptanceChecklist", JavaExec) {
	description = "Regenerates the omission-visible manual gameplay checklist."
	group = "documentation"
	dependsOn("testClasses")
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "com.powers.testing.ManualAcceptanceChecklistReport"
	args projectDir.absolutePath
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.named("sourcesJar") {
	// Split source sets legitimately contain the same package-info path; publish one canonical copy.
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
