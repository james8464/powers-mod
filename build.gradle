plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id 'info.solidsoft.pitest' version '1.19.0'
}

pitest {
	pitestVersion = '1.25.3'
	junit5PluginVersion = '1.2.3'
	targetClasses = [
			'com.powers.magic.MagicInteractionResolver',
			'com.powers.magic.runtime.MagicLifecycleRules',
			'com.powers.item.artifact.ArtifactAuthorizationRules',
			'com.powers.power.abilities.ForcefieldRules',
			'com.powers.power.abilities.TimeFreezeDrainRules',
			'com.powers.spell.CelestialRuinRules'
	]
	targetTests = [
			'com.powers.magic.MagicInteractionResolverTest',
			'com.powers.magic.runtime.MagicLifecycleRulesTest',
			'com.powers.item.artifact.ArtifactAuthorizationRulesTest',
			'com.powers.power.abilities.ForcefieldRulesTest',
			'com.powers.power.abilities.TimeFreezeDrainRulesTest',
			'com.powers.spell.CelestialRuinRulesTest'
	]
	threads = 4
	mutationThreshold = 80
	coverageThreshold = 85
	outputFormats = ['XML', 'HTML']
	timestampedReports = false
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

def compatibilityGameTestsEnabled = providers.gradleProperty("powersCompatibilityGameTests").isPresent()
		|| gradle.startParameter.taskNames.any { it.split(":").last() == "runCompatibilityGameTest" }

sourceSets {
	exampleExtension {
		java.srcDir "src/exampleExtension/java"
		compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
		runtimeClasspath += output + compileClasspath
	}
}

configurations {
	exampleExtensionImplementation.extendsFrom implementation
}

loom {
	splitEnvironmentSourceSets()
	if (providers.gradleProperty("powersRunDir").isPresent()) {
		runs.named("client") {
			runDirectory.set(file(providers.gradleProperty("powersRunDir").get()))
		}
		runs.named("server") {
			runDirectory.set(file(providers.gradleProperty("powersRunDir").get()))
		}
	}

	mods {
		"powers" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "powers-gametest"
		enableGameTests = true
		enableClientGameTests = true
		eula = true
	}
}

if (compatibilityGameTestsEnabled) {
	loom.runs.named("gameTest") {
		runDirectory.set(layout.buildDirectory.dir("compatibility-runs/complete-gametest"))
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	testImplementation "org.junit.jupiter:junit-jupiter:6.0.3"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher:6.0.3"
	gametestImplementation sourceSets.exampleExtension.output
}

tasks.named("compileGametestJava") {
	dependsOn tasks.named("compileExampleExtensionJava")
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}

	exclude "**/.DS_Store"
}

tasks.register("validatePowerResources", Exec) {
	group = "verification"
	description = "Validates JSON, models, textures, translations, recipes and namespace safety."
	commandLine "python3", "scripts/validate_resources.py", "--root", "src/main/resources"
}

tasks.register("auditJavaSources", Exec) {
	group = "verification"
	description = "Verifies the exact-version manifest for every production Java source."
	commandLine "python3", "scripts/audit_java_sources.py", "--check"
}

tasks.register("auditNonItemAssets", Exec) {
	group = "verification"
	description = "Verifies the exact-version manifest for every non-item POWERS asset."
	commandLine "python3", "scripts/audit_non_item_assets.py", "--check"
}

tasks.register("updateVfxAssetAudit", JavaExec) {
	group = "documentation"
	description = "Regenerates the exact-identity VFX asset graph manifest."
	dependsOn("testClasses")
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "com.powers.client.visual.VfxAssetAudit"
	args projectDir.absolutePath, "--update"
}

tasks.register("verifyVfxAssetAudit", JavaExec) {
	group = "verification"
	description = "Rejects structural VFX asset graph or identity drift."
	dependsOn("testClasses")
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "com.powers.client.visual.VfxAssetAudit"
	args projectDir.absolutePath, "--check"
}

tasks.register("generateMagicDocs", JavaExec) {
	group = "documentation"
	description = "Regenerates the canonical action and exhaustive interaction documents."
	dependsOn("classes")
	classpath = sourceSets.main.runtimeClasspath
	mainClass = "com.powers.magic.MagicDocumentation"
	args projectDir.absolutePath
}

tasks.register("verifyMagicDocs", JavaExec) {
	group = "verification"
	description = "Rejects stale canonical magic interaction documents."
	dependsOn("classes")
	classpath = sourceSets.main.runtimeClasspath
	mainClass = "com.powers.magic.MagicDocumentation"
	args projectDir.absolutePath, "--check"
}

tasks.register("verifyItemDocs", Exec) {
	group = "verification"
	description = "Rejects stale generated item and acquisition documentation."
	commandLine "python3", "scripts/generate_item_docs.py", "--check"
}

tasks.register("generateRankDocs", Exec) {
	group = "documentation"
	description = "Regenerates the source-backed Light and Darkness rank appendix."
	commandLine "python3", "scripts/generate_rank_docs.py"
}

tasks.register("verifyRankDocs", Exec) {
	group = "verification"
	description = "Rejects stale generated Light and Darkness rank documentation."
	commandLine "python3", "scripts/generate_rank_docs.py", "--check"
}

tasks.register("testPythonScripts", Exec) {
	group = "verification"
	description = "Runs deterministic generator and resource-validator fixture tests."
	commandLine "python3", "-B", "-m", "unittest", "discover", "-s", "scripts/tests", "-p", "test_*.py"
}

def compatibilityManifest = layout.projectDirectory.file("config/compatibility/net-011.json")
def compatibilityCache = providers.gradleProperty("powersCompatibilityCache")
		.orElse(layout.projectDirectory.dir(".compatibility-cache/net-011").asFile.absolutePath)
def compatibilityProfile = providers.gradleProperty("powersCompatibilityProfile").orElse("complete")
def compatibilitySide = providers.gradleProperty("powersCompatibilitySide").orElse("server")
def compatibilityRunDir = providers.gradleProperty("powersCompatibilityRunDir")
		.orElse(layout.buildDirectory.dir("compatibility-runs").get().asFile.absolutePath)

tasks.register("verifyCompatibilityArtifacts", Exec) {
	group = "verification"
	description = "Verifies NET-011 pinned compatibility artifacts from the ignored local cache."
	commandLine "python3", "-B", "scripts/compatibility_harness.py", "verify",
			"--manifest", compatibilityManifest.asFile.absolutePath,
			"--cache", compatibilityCache.get()
}

tasks.register("prepareCompatibilityRun", Exec) {
	group = "verification"
	description = "Assembles one isolated NET-011 Fabric client or server run directory."
	def target = providers.provider {
		new File(compatibilityRunDir.get(), "${compatibilityProfile.get()}-${compatibilitySide.get()}")
	}
	commandLine "python3", "-B", "scripts/compatibility_harness.py", "assemble",
			"--manifest", compatibilityManifest.asFile.absolutePath,
			"--cache", compatibilityCache.get(),
			"--profile", compatibilityProfile.get(),
			"--side", compatibilitySide.get(),
			"--run-dir", target.get().absolutePath,
			"--allowed-root", file(compatibilityRunDir.get()).absolutePath
	doFirst {
		file(compatibilityRunDir.get()).mkdirs()
	}
	doLast {
		logger.lifecycle("Use -PpowersRunDir={} with run{} for this isolated profile.",
				target.get().absolutePath, compatibilitySide.get().capitalize())
	}
}

def compatibilityGameTestRoot = layout.buildDirectory.dir("compatibility-runs")
def compatibilityGameTestRun = layout.buildDirectory.dir("compatibility-runs/complete-gametest")
tasks.register("prepareCompatibilityGameTest", Exec) {
	group = "verification"
	description = "Hash-verifies and stages the pinned complete server profile for isolated GameTests."
	commandLine "python3", "-B", "scripts/compatibility_harness.py", "assemble",
			"--manifest", compatibilityManifest.asFile.absolutePath,
			"--cache", compatibilityCache.get(),
			"--profile", "complete", "--side", "server",
			"--run-dir", compatibilityGameTestRun.get().asFile.absolutePath,
			"--allowed-root", compatibilityGameTestRoot.get().asFile.absolutePath
	doFirst {
		compatibilityGameTestRoot.get().asFile.mkdirs()
	}
}

tasks.register("runCompatibilityGameTest") {
	group = "verification"
	description = "Runs GameTests in an owned isolated directory with the verified complete server profile."
	dependsOn("prepareCompatibilityGameTest", "runGameTest")
}
tasks.named("runGameTest") {
	if (compatibilityGameTestsEnabled) {
		dependsOn("prepareCompatibilityGameTest")
	}
}
tasks.named("runGameTest").configure {
	mustRunAfter("prepareCompatibilityGameTest")
}

// The 90-minute connected-player profile is intentionally absent from ordinary
// GameTest registration. Opting in adds its entrypoint to the processed test-mod
// metadata and selects only that test, so routine verification stays bounded.
def connectedProfileEnabled = providers.gradleProperty("powersConnectedProfile").isPresent()
def restartSoakEnabled = providers.gradleProperty("powersRestartSoak").isPresent()
def perf016BenchmarkEnabled = providers.gradleProperty("powersPerf016Benchmark").isPresent()
def vfx011ClientOnly = providers.gradleProperty("vfx011ClientOnly").isPresent()
tasks.named("processGametestResources") {
	inputs.property("connectedProfileEnabled", connectedProfileEnabled)
	inputs.property("restartSoakEnabled", restartSoakEnabled)
	inputs.property("perf016BenchmarkEnabled", perf016BenchmarkEnabled)
	inputs.property("compatibilityGameTestsEnabled", compatibilityGameTestsEnabled)
	inputs.property("vfx011ClientOnly", vfx011ClientOnly)
	filesMatching("fabric.mod.json") {
		filter { line ->
			vfx011ClientOnly && line.contains("com.powers.client.LightRealmSkyClientGameTests")
					? null
					: line
		}
		expand connectedProfileEntrypoint: connectedProfileEnabled
				? ',\n\t\t\t"com.powers.gametest.ConnectedBotProfileGameTests"'
				: '',
				restartSoakEntrypoint: restartSoakEnabled
						? ',\n\t\t\t"com.powers.gametest.RestartSoakGameTests"'
						: '',
				perf016BenchmarkEntrypoint: perf016BenchmarkEnabled
						? ',\n\t\t\t"com.powers.force.CatastrophicBlockWorkGameTests"'
						: '',
				compatibilityEntrypoint: compatibilityGameTestsEnabled
						? ',\n\t\t\t"com.powers.gametest.CompatibilityInventoryGameTests"'
						: ''
	}
}

tasks.named("runGameTest") {
	if (providers.gradleProperty("gameTestFilter").isPresent()) {
		systemProperty "fabric-api.gametest.filter", providers.gradleProperty("gameTestFilter").get()
	} else if (perf016BenchmarkEnabled) {
		systemProperty "fabric-api.gametest.filter",
				"powers-gametest:catastrophic_block_work_game_tests_catastrophic_containment_cannot_starve_another_dimension"
	} else if (restartSoakEnabled) {
		systemProperty "fabric-api.gametest.filter",
				"powers-gametest:restart_soak_game_tests_seeds_settles_and_persists_every_runtime_owner"
	} else if (connectedProfileEnabled) {
		systemProperty "fabric-api.gametest.filter",
				"powers-gametest:connected_bot_profile_game_tests_connected_ten_fifty_and_hundred_player_profiles"
		if (providers.gradleProperty("powersProfileTicks").isPresent()) {
			systemProperty "powers.profile.ticks",
					providers.gradleProperty("powersProfileTicks").get()
		}
		if (providers.gradleProperty("powersProfilePopulation").isPresent()) {
			systemProperty "powers.profile.population",
					providers.gradleProperty("powersProfilePopulation").get()
		}
	} else if (providers.gradleProperty("gameTestFilter").isPresent()) {
		systemProperty "fabric-api.gametest.filter", providers.gradleProperty("gameTestFilter").get()
	}
	doFirst {
		def gameTestRun = compatibilityGameTestsEnabled
				? compatibilityGameTestRun.get().asFile
				: layout.buildDirectory.dir("run/gameTest").get().asFile
		delete(new File(gameTestRun, "world"))
		if (!compatibilityGameTestsEnabled) {
			delete(new File(gameTestRun, "mods"))
		}
		gameTestRun.mkdirs()
		def properties = new File(gameTestRun, "server.properties")
		if (!properties.exists()) {
			properties.text = "online-mode=false\nlevel-name=world\n"
		}
		def eula = new File(gameTestRun, "eula.txt")
		if (!eula.exists()) {
			eula.text = "eula=true\n"
		}
	}
}

tasks.named("runServer") {
	// Required by restart_soak.py and useful for ordinary dedicated-server administration.
	standardInput = System.in
	doFirst {
		def configuredRun = providers.gradleProperty("powersRunDir").orNull
		def serverRun = configuredRun == null ? file("run") : file(configuredRun)
		serverRun.mkdirs()
		def properties = new File(serverRun, "server.properties")
		if (!properties.exists()) {
			properties.text = "online-mode=false\nlevel-name=world\n"
		}
		def eula = new File(serverRun, "eula.txt")
		if (!eula.exists()) {
			eula.text = "eula=true\n"
		}
	}
}

tasks.named("check") {
	dependsOn("validatePowerResources")
	dependsOn("auditJavaSources")
	dependsOn("auditNonItemAssets")
	dependsOn("verifyVfxAssetAudit")
	dependsOn("verifyMagicDocs")
	dependsOn("verifyItemDocs")
	dependsOn("verifyRankDocs")
	dependsOn("testPythonScripts")
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.compilerArgs += ["-Xlint:deprecation", "-Xlint:unchecked", "-Werror"]
}

tasks.withType(Test).configureEach { Test testTask ->
	useJUnitPlatform()
	def rawRunId = providers.environmentVariable("POWERS_TEST_RUN_ID")
			.orElse(providers.gradleProperty("powersTestRunId"))
			.orElse("default").get()
	def testRunId = rawRunId.replaceAll("[^A-Za-z0-9._-]", "_").take(80)
	reports.junitXml.outputLocation = layout.buildDirectory.dir("test-results/${testTask.name}/${testRunId}")
	reports.html.outputLocation = layout.buildDirectory.dir("reports/tests/${testTask.name}/${testRunId}")
	binaryResultsDirectory = layout.buildDirectory.dir("test-results/${testTask.name}/${testRunId}/binary")
}

tasks.register("saveMigrationCorpus", Test) {
	description = "Runs versioned save and selection migration acceptance fixtures."
	group = "verification"
	useJUnitPlatform()
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	filter {
		includeTestsMatching "com.powers.migration.*"
		includeTestsMatching "com.powers.item.artifact.ArtifactSelectionMigrationTest"
		includeTestsMatching "com.powers.item.artifact.ArtifactFavouriteRulesTest"
		includeTestsMatching "com.powers.spell.SpellSelectionMigrationTest"
		includeTestsMatching "com.powers.progression.RankMigrationTest"
	}
}

tasks.register("verifyScreenshots", Test) {
	description = "Runs deterministic client presentation and screenshot-contract checks."
	group = "verification"
	useJUnitPlatform()
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	filter {
		includeTestsMatching "com.powers.client.visual.*"
		includeTestsMatching "com.powers.hud.HudLayoutTest"
		includeTestsMatching "com.powers.hud.HudMathTest"
	}
}

tasks.register("syntheticSoak", Test) {
	description = "Runs the separately attributed deterministic multiplayer budget soak."
	group = "verification"
	useJUnitPlatform()
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	filter {
		includeTestsMatching "com.powers.performance.SyntheticMultiplayerSoakTest"
	}
}

def perf006Label = providers.gradleProperty("powersPerf006Label").orElse("capture")
tasks.register("perf006AllocationProfile", JavaExec) {
	description = "Captures the exact PERF-006 allocation workload with JFR and ThreadMXBean."
	group = "verification"
	dependsOn("testClasses")
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "com.powers.performance.FxAllocationProfile"
	doFirst {
		def safeLabel = perf006Label.get().replaceAll("[^A-Za-z0-9._-]", "_").take(80)
		def output = layout.buildDirectory.dir("perf-006-allocation").get().asFile
		output.mkdirs()
		def recording = new File(output, "${safeLabel}.jfr")
		delete(recording)
		jvmArgs "-XX:StartFlightRecording=filename=${recording.absolutePath},settings=profile,dumponexit=true,maxsize=256m"
		args new File(output, "${safeLabel}.json").absolutePath, safeLabel
	}
}

tasks.register("perf015CompressionProfile", JavaExec) {
	description = "Measures Minecraft-style semantic-FX compression from 64 bytes through 8 KiB."
	group = "verification"
	dependsOn("testClasses")
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "com.powers.network.FxCompressionProfile"
	args layout.buildDirectory.file("perf-015-compression/profile.json").get().asFile.absolutePath
}

tasks.register("updateVisualGoldens", JavaExec) {
	description = "Regenerates reviewed, deterministic client visual goldens."
	group = "documentation"
	dependsOn("testClasses")
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "com.powers.client.visual.VisualGoldenHarness"
	args projectDir.absolutePath, "--update"
}

tasks.register("verifyVisualGoldens", JavaExec) {
	description = "Fails when client visual assets or layout drift from reviewed goldens."
	group = "verification"
	dependsOn("testClasses")
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "com.powers.client.visual.VisualGoldenHarness"
	args projectDir.absolutePath, "--check"
}

tasks.named("verifyScreenshots") {
	dependsOn("verifyVisualGoldens")
}

tasks.register("generateLootDistributionReport", JavaExec) {
	description = "Publishes deterministic additive-loot distribution evidence."
	group = "documentation"
	dependsOn("testClasses")
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "com.powers.loot.LootDistributionReport"
	args projectDir.absolutePath
}

tasks.register("generateManualAcceptanceChecklist", JavaExec) {
	description = "Regenerates the omission-visible manual gameplay checklist."
	group = "documentation"
	dependsOn("testClasses")
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "com.powers.testing.ManualAcceptanceChecklistReport"
	args projectDir.absolutePath
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.named("sourcesJar") {
	// Split source sets legitimately contain the same package-info path; publish one canonical copy.
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
