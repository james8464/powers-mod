name: POWERS verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: powers-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew clean check --no-daemon
      - run: ./gradlew verifyItemDocs verifyMagicDocs verifyRankDocs --no-daemon
      - run: python3 scripts/generate_item_docs.py
      - run: ./gradlew generateMagicDocs generateRankDocs --no-daemon
      - run: git diff --exit-code

  synthetic-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: POWERS_TEST_RUN_ID=synthetic-soak ./gradlew syntheticSoak --no-daemon

  gametest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./test.sh gametest

  release-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: python3 scripts/server_smoke.py
      - run: ./gradlew saveMigrationCorpus --no-daemon
      - run: ./gradlew pitest --no-daemon
      - run: ./gradlew validatePowerResources verifyMagicDocs --no-daemon
      - run: ./gradlew verifyScreenshots --no-daemon

  packet-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: POWERS_TEST_RUN_ID=packet-fuzz ./gradlew test --tests 'com.powers.network.*FuzzTest' --no-daemon
